    Movement: Harmonic Cadence & Luminescent Fluidity
    Subject: Crimean Tatar 9x5 Taraq Tamğa Bio-Responsive Breathing & Curl-Noise Harmonic Field
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QırımKey — Tamğa Harmonic Cadence (Algorithmic Art Viewer)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors (Preserved from viewer.html template) */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.45;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 28px;
        }

        .control-section h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 10px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 58px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 14px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 960px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.14);
            background: #0b131e;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 60px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Tamğa Harmonic Cadence</h1>
            <div class="subtitle">
                Bio-responsive 9×5 Crimean Tatar <strong>Taraq Tamğa</strong> attractor field synced to human typing speed (15–75 WPM) with word-commit golden interference ripples.
            </div>

            <!-- Seed Section (FIXED TEMPLATE SECTION) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="4650" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">Random Seed</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Typing Cadence (WPM)</label>
                    <div class="slider-container">
                        <input type="range" id="typingWPM" min="0" max="75" step="1" value="42" oninput="updateParam('typingWPM', this.value)">
                        <span class="value-display" id="typingWPM-value">42 WPM</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Streamline Particles</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="400" max="3200" step="200" value="1600" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">1600</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Harmonic Field Curl</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.012" step="0.001" value="0.004" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.004</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Attractor Pull (9×5 Grid)</label>
                    <div class="slider-container">
                        <input type="range" id="attractorStrength" min="0.1" max="2.0" step="0.1" value="0.9" oninput="updateParam('attractorStrength', this.value)">
                        <span class="value-display" id="attractorStrength-value">0.9</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Persistence</label>
                    <div class="slider-container">
                        <input type="range" id="trailPersistence" min="4" max="32" step="2" value="14" oninput="updateParam('trailPersistence', this.value)">
                        <span class="value-display" id="trailPersistence-value">14</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>National Gold (Tamğa & Commit Pulse)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#ffd700" onchange="updateColor(0, this.value)">
                        <span class="color-value" id="color1-value">#ffd700</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Crimean Sky Blue (Primary Flow)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#1295d8" onchange="updateColor(1, this.value)">
                        <span class="color-value" id="color2-value">#1295d8</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Deep Black Sea Canvas</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#0b131e" onchange="updateColor(2, this.value)">
                        <span class="color-value" id="color3-value">#0b131e</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button secondary" onclick="triggerWordCommitPulse()">Commit Word (Pulse)</button>
                </div>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button tertiary" onclick="downloadCanvasPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing Tamğa Harmonic Field...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS — HARMONIC CADENCE & LUMINESCENT FLUIDITY
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 4650, // 46.5° N Crimean parallel reference
            typingWPM: 42,
            particleCount: 1600,
            noiseScale: 0.004,
            attractorStrength: 0.9,
            trailPersistence: 14,
            colorPalette: ['#ffd700', '#1295d8', '#0b131e']
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // Canonical 20-vertex Taraq Tamğa polygon on the 9x5 grid (from SpaceBarLabel.swift)
        const TAMGA_GRID_VERTICES = [
            [1, 0], [8, 0],
            [8, 3], [9, 3],
            [9, 4], [7, 4],
            [7, 1], [5, 1],
            [5, 4], [6, 4],
            [6, 5], [3, 5],
            [3, 4], [4, 4],
            [4, 1], [2, 1],
            [2, 4], [0, 4],
            [0, 3], [1, 3]
        ];

        let particles = [];
        let ripples = [];
        let tamgaWorldVertices = [];
        let phaseAngle = 0.0;
        let currentExertion = 0.45;
        let targetExertion = 0.45;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pixelDensity(1);
            initializeSystem();
            let loader = document.querySelector('.loading');
            if (loader) loader.style.display = 'none';
        }

        function computeTamgaVertices(scaleFactor) {
            const gridW = 9.0;
            const gridH = 5.0;
            const unit = (width * 0.46 * scaleFactor) / gridW;
            const ox = width * 0.5 - (gridW * unit) * 0.5;
            const oy = height * 0.5 - (gridH * unit) * 0.5;
            return TAMGA_GRID_VERTICES.map(pt => ({
                x: ox + pt[0] * unit,
                y: oy + pt[1] * unit
            }));
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            targetExertion = constrain(params.typingWPM / 75.0, 0.0, 1.0);
            currentExertion = targetExertion;
            phaseAngle = 0.85;
            tamgaWorldVertices = computeTamgaVertices(1.0);

            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new FlowParticle(i));
            }

            ripples = [
                { r: 110, maxR: 540, alpha: 0.82 },
                { r: 235, maxR: 540, alpha: 0.58 },
                { r: 370, maxR: 540, alpha: 0.36 }
            ];

            let bgCol = color(params.colorPalette[2]);
            background(red(bgCol), green(bgCol), blue(bgCol));

            // Pre-warm 26 advection steps so seed changes & initial load immediately show rich streamlines
            let goldCol = color(params.colorPalette[0]);
            let blueCol = color(params.colorPalette[1]);
            let warmSpeed = 1.0 + currentExertion * 1.9;
            for (let step = 0; step < 26; step++) {
                noStroke();
                fill(red(bgCol), green(bgCol), blue(bgCol), 9);
                rect(0, 0, width, height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(warmSpeed, 0.65);
                    particles[i].display(goldCol, blueCol, currentExertion);
                }
            }
        }

        function triggerWordCommitPulse() {
            targetExertion = min(1.0, targetExertion + 0.22);
            ripples.push({
                r: 60,
                maxR: 560,
                alpha: 1.0
            });
        }

        function draw() {
            // Smooth physiological exertion convergence (matches SpaceBarLabel.swift 15..75 WPM -> 1.0x..2.9x)
            let sliderTarget = constrain(params.typingWPM / 75.0, 0.0, 1.0);
            targetExertion = lerp(targetExertion, sliderTarget, 0.05);
            currentExertion += (targetExertion - currentExertion) * 0.12;

            let speedMultiplier = 1.0 + currentExertion * 1.9; // 1.0x at rest -> 2.9x at 75 WPM
            let dt = (1.0 / 60.0) * speedMultiplier;
            phaseAngle += dt * ( TWO_PI / 4.4 ); // 4.4s full breathing cycle at rest

            let breathWave = 0.5 - 0.5 * cos(phaseAngle); // [0, 1] smooth sinusoid
            let tamgaOpacity = lerp(0.25, 0.52, breathWave) + currentExertion * 0.28;
            let tamgaScale = lerp(0.975, 1.045, breathWave);

            let bgCol = color(params.colorPalette[2]);
            noStroke();
            fill(red(bgCol), green(bgCol), blue(bgCol), map(params.trailPersistence, 4, 32, 36, 8));
            rect(0, 0, width, height);

            tamgaWorldVertices = computeTamgaVertices(tamgaScale);

            // Update & draw particles in harmonic flow field
            let goldCol = color(params.colorPalette[0]);
            let blueCol = color(params.colorPalette[1]);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(speedMultiplier, breathWave);
                particles[i].display(goldCol, blueCol, currentExertion);
            }

            // Update & draw word-commit harmonic ripples
            noFill();
            for (let i = ripples.length - 1; i >= 0; i--) {
                let rp = ripples[i];
                rp.r += 3.2 * speedMultiplier;
                rp.alpha *= 0.972;
                let progress = rp.r / rp.maxR;
                if (rp.alpha < 0.02 || progress >= 1.0) {
                    ripples.splice(i, 1);
                    continue;
                }
                strokeWeight(lerp(2.6, 0.6, progress));
                stroke(red(goldCol), green(goldCol), blue(goldCol), rp.alpha * 145);
                drawRoundedTamgaContour(1.0 + progress * 0.65);
            }

            // Draw subtle 9x5 architectural reference grid ticks
            drawArchitecturalTelemetry(goldCol, blueCol, speedMultiplier, tamgaScale, tamgaOpacity);

            // Draw central breathing Taraq Tamğa with rounded corners
            drawCentralBreathingTamga(goldCol, blueCol, tamgaScale, tamgaOpacity, breathWave);
        }

        function drawRoundedTamgaContour(scaleFactor) {
            let pts = computeTamgaVertices(scaleFactor);
            beginShape();
            for (let i = 0; i < pts.length; i++) {
                let prev = pts[(i - 1 + pts.length) % pts.length];
                let curr = pts[i];
                let next = pts[(i + 1) % pts.length];
                let v1x = prev.x - curr.x, v1y = prev.y - curr.y;
                let v2x = next.x - curr.x, v2y = next.y - curr.y;
                let l1 = max(1, Math.hypot(v1x, v1y));
                let l2 = max(1, Math.hypot(v2x, v2y));
                let r = min(10, min(l1, l2) * 0.18);
                vertex(curr.x + (v1x / l1) * r, curr.y + (v1y / l1) * r);
                quadraticVertex(curr.x, curr.y, curr.x + (v2x / l2) * r, curr.y + (v2y / l2) * r);
            }
            endShape(CLOSE);
        }

        function drawCentralBreathingTamga(goldCol, blueCol, tamgaScale, tamgaOpacity, breathWave) {
            push();
            // Outer sky-blue aura
            noFill();
            strokeWeight(6.0);
            stroke(red(blueCol), green(blueCol), blue(blueCol), tamgaOpacity * 55);
            drawRoundedTamgaContour(tamgaScale * 1.018);

            // Translucent interior fill
            fill(red(goldCol), green(goldCol), blue(goldCol), tamgaOpacity * 48);
            strokeWeight(2.2);
            stroke(red(goldCol), green(goldCol), blue(goldCol), constrain(tamgaOpacity * 255, 70, 245));
            drawRoundedTamgaContour(tamgaScale);

            // Vertex harmonic nodes
            let pts = computeTamgaVertices(tamgaScale);
            noStroke();
            for (let i = 0; i < pts.length; i++) {
                fill(red(goldCol), green(goldCol), blue(goldCol), 140 + 95 * breathWave);
                circle(pts[i].x, pts[i].y, 4.5);
            }
            pop();
        }

        function drawArchitecturalTelemetry(goldCol, blueCol, speedMultiplier, tamgaScale, tamgaOpacity) {
            push();
            stroke(255, 255, 255, 24);
            strokeWeight(1);
            line(60, height - 74, width - 60, height - 74);

            noStroke();
            fill(255, 255, 255, 135);
            textFont('Courier New');
            textSize(13);
            textAlign(LEFT, BOTTOM);
            text(
                `QIRIMKEY BIO-CADENCE FIELD  |  9x5 TARAQ TAMGA  |  SEED ${params.seed}  |  46.5°N`,
                60,
                height - 46
            );

            textAlign(RIGHT, BOTTOM);
            fill(red(goldCol), green(goldCol), blue(goldCol), 200);
            text(
                `WPM: ${params.typingWPM}  |  BREATH SPEED: ${speedMultiplier.toFixed(2)}x  |  SCALE: ${tamgaScale.toFixed(3)}`,
                width - 60,
                height - 46
            );
            pop();
        }

        class FlowParticle {
            constructor(index) {
                this.index = index;
                this.reset(true);
            }

            reset(randomStart) {
                if (randomStart || random() < 0.65) {
                    this.x = random(36, width - 36);
                    this.y = random(36, height - 96);
                } else {
                    // Spawn near one of the 20 Tamğa vertices
                    let v = tamgaWorldVertices[floor(random(tamgaWorldVertices.length))];
                    this.x = v.x + random(-24, 24);
                    this.y = v.y + random(-24, 24);
                }
                this.prevX = this.x;
                this.prevY = this.y;
                this.life = random(90, 260);
                this.age = randomStart ? random(18, this.life * 0.82) : 0;
                this.goldAffinity = random();
            }

            update(speedMultiplier, breathWave) {
                this.prevX = this.x;
                this.prevY = this.y;

                // Curl-like multi-octave Perlin angle
                let n = noise(
                    this.x * params.noiseScale,
                    this.y * params.noiseScale,
                    phaseAngle * 0.08
                );
                let angle = n * TWO_PI * 3.0;

                // Harmonic tangential + radial force toward nearest Tamğa vertex
                let nearestDist = 999999;
                let nearestVx = width * 0.5;
                let nearestVy = height * 0.5;
                for (let i = 0; i < tamgaWorldVertices.length; i++) {
                    let v = tamgaWorldVertices[i];
                    let d = dist(this.x, this.y, v.x, v.y);
                    if (d < nearestDist) {
                        nearestDist = d;
                        nearestVx = v.x;
                        nearestVy = v.y;
                    }
                }

                let dx = nearestVx - this.x;
                let dy = nearestVy - this.y;
                let attractAngle = atan2(dy, dx) + HALF_PI * (0.65 + 0.35 * sin(phaseAngle));
                let influence = constrain(map(nearestDist, 0, 380, 1.0, 0.0), 0.0, 1.0) * params.attractorStrength;

                let vx = cos(angle) * (1.0 - influence * 0.45) + cos(attractAngle) * influence;
                let vy = sin(angle) * (1.0 - influence * 0.45) + sin(attractAngle) * influence;

                let stepSize = (2.15 + 1.15 * speedMultiplier) * (0.85 + 0.3 * breathWave);
                this.x += vx * stepSize;
                this.y += vy * stepSize;
                this.age++;

                if (this.x < 24 || this.x > width - 24 || this.y < 24 || this.y > height - 92 || this.age >= this.life) {
                    this.reset(false);
                }
            }

            display(goldCol, blueCol, exertion) {
                let lifeRatio = sin((this.age / this.life) * PI);
                let useGold = this.goldAffinity < (0.34 + exertion * 0.38);
                let c = useGold ? goldCol : blueCol;
                let alpha = lifeRatio * (useGold ? 215 : 175);
                stroke(red(c), green(c), blue(c), alpha);
                strokeWeight(useGold ? 1.85 : 1.35);
                line(this.prevX, this.prevY, this.x, this.y);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            let num = parseFloat(value);
            params[paramName] = num;
            let disp = document.getElementById(paramName + '-value');
            if (disp) {
                disp.textContent = paramName === 'typingWPM' ? `${num} WPM` : value;
            }
            if (paramName === 'particleCount') {
                initializeSystem();
            }
        }

        function updateColor(index, value) {
            params.colorPalette[index] = value;
            let id = 'color' + (index + 1);
            let valSpan = document.getElementById(id + '-value');
            if (valSpan) valSpan.textContent = value;
            if (index === 2) {
                let bgCol = color(value);
                background(red(bgCol), green(bgCol), blue(bgCol));
            }
        }

        function downloadCanvasPNG() {
            saveCanvas('QirimKey_Tamga_Harmonic_Cadence_Seed_' + params.seed, 'png');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS (FIXED TEMPLATE INTERFACE)
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            document.getElementById('typingWPM').value = params.typingWPM;
            document.getElementById('typingWPM-value').textContent = params.typingWPM + ' WPM';
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScale-value').textContent = params.noiseScale;
            document.getElementById('attractorStrength').value = params.attractorStrength;
            document.getElementById('attractorStrength-value').textContent = params.attractorStrength;
            document.getElementById('trailPersistence').value = params.trailPersistence;
            document.getElementById('trailPersistence-value').textContent = params.trailPersistence;

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
