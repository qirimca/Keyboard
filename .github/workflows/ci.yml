name: CI

on:
  push:
    branches: [ main, master, ipad-floating-and-shift-audit, 'audit/**' ]
  pull_request:
    branches: [ main, master, ipad-floating-and-shift-audit ]
  workflow_dispatch:

jobs:
  db-smoke:
    name: SQLite Smoke & Private API Guard (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Bundled SQLite Predictions Database
        run: python3 QTatar/Scripts/verify_keyboard_db.py
      - name: Reject Private API Source Identifiers
        run: bash scripts/check_private_api_strings.sh QTatar

  test-and-build:
    name: Swift Package Tests & Simulator Build
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Repository Hygiene (Symlinks, Plists, No Hardcoded Paths)
        run: |
          broken_links=$(find . -type l ! -exec test -e {} \; -print)
          if [ -n "$broken_links" ]; then
            echo "Broken symlinks found: $broken_links"
            exit 1
          fi
          find QTatar -name "*.plist" -exec plutil -lint {} +
          if grep -rn "/Users/" QTatar/Demo QTatar/Sources QTatar/Scripts --exclude="*.pyc"; then
            echo "Hardcoded /Users/ path found in source files"
            exit 1
          fi

      - name: Verify Bundled SQLite Predictions Database
        run: python3 QTatar/Scripts/verify_keyboard_db.py

      - name: Run Transliteration & Autocomplete Swift Package Tests
        run: swift test --package-path QTatar/Demo/Tests/Transliteration --scratch-path /tmp/qtatar-spm-build

      - name: Build QTatar App & Keyboard Extension for iOS Simulator
        run: |
          xcodebuild \
            -project QTatar/Demo/QTatar.xcodeproj \
            -scheme QTatar \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build
