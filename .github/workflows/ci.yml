name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  swift-package:
    name: Swift package tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Swift tests
        working-directory: QTatar
        run: swift test

  corpus-scripts:
    name: Corpus script smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check corpus script CLIs
        working-directory: QTatar
        run: |
          python3 Scripts/build_corpus.py --help
          python3 Scripts/build_ngrams.py --help
