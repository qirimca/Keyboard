<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2064 2752" width="2064" height="2752">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090F1C" />
      <stop offset="100%" stop-color="#050912" />
    </linearGradient>
    <linearGradient id="sunsetVeil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07101E" stop-opacity="0.72" />
      <stop offset="28%" stop-color="#0B1628" stop-opacity="0.46" />
      <stop offset="100%" stop-color="#050912" stop-opacity="0.86" />
    </linearGradient>
    <linearGradient id="aluminumRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="227" y="509" width="1609" height="2091" rx="44" ry="44" />
    </clipPath>
    <filter id="deviceShadow" x="-10%" y="-8%" width="120%" height="122%">
      <feDropShadow dx="0" dy="28" stdDeviation="38" flood-color="#000000" flood-opacity="0.62" />
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Layer & Crimean Coast Sunset Photography -->
  <rect id="layer-background" width="2064" height="2752" fill="url(#bgGrad)" />
  <image id="layer-crimea-sunset" href="/Users/love/Documents/Documents - MacBook Air - Віта/GitHub/Keyboard/marketing/templates/assets/crimea_sunset_bg.png" x="0" y="0" width="2064" height="2752" preserveAspectRatio="xMidYMid slice" />
  <rect id="layer-veil" width="2064" height="2752" fill="url(#sunsetVeil)" />

  <!-- Clean Apple-Grade Headline & Subheadline Copy Layer -->
  <g id="layer-copy" filter="url(#textShadow)">
    <text x="1032" y="159" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="35" font-weight="700" letter-spacing="2.4" fill="#38BDF8">100% НА ПРИСТРОЇ • ПОВНА ПРИВАТНІСТЬ</text>
    <text x="1032" y="291" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="74" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">Ваші дані у безпеці</text>
    <text x="1032" y="396" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="43" font-weight="500" fill="#CBD5E1">Працює повністю офлайн • Жодні тексти не передаються в мережу</text>
  </g>

  <!-- Realistic iPad Pro Hardware Chassis & Screen Layer -->
  <g id="layer-device-frame" filter="url(#deviceShadow)">
    <!-- Top Power & Side Volume Buttons -->
    <rect x="1674" y="461" width="76" height="10" rx="3" fill="#64748B" />
    <rect x="1874" y="881" width="10" height="99" rx="3" fill="#64748B" />
    <rect x="1874" y="1011" width="10" height="99" rx="3" fill="#64748B" />

    <!-- Outer Aluminum Rim & Inner Black Bezel -->
    <rect x="187" y="469" width="1689" height="2171" rx="79" ry="79" fill="url(#aluminumRim)" />
    <rect x="197" y="479" width="1669" height="2151" rx="69" ry="69" fill="#080A0F" />

    <!-- Front TrueDepth Camera Lens in Top Bezel -->
    <circle cx="1032" cy="494" r="6" fill="#111827" stroke="#1E293B" stroke-width="2" />

    <!-- Real Build Screenshot -->
    <image href="/Users/love/Documents/Documents - MacBook Air - Віта/GitHub/Keyboard/docs/release/2026-10-25/assets/store_ipad_05_home_dark_uk.png" x="227" y="509" width="1609" height="2091" clip-path="url(#screenClip)" preserveAspectRatio="xMidYMid slice" />
  </g>
</svg>
