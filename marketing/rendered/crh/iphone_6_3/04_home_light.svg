    </linearGradient>
    <linearGradient id="sunsetVeil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09111E" stop-opacity="0.52" />
      <stop offset="35%" stop-color="#0C1729" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#060B14" stop-opacity="0.88" />
