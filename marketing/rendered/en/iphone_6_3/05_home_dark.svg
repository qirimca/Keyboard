<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1206 2622" width="1206" height="2622">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090F1C" />
      <stop offset="100%" stop-color="#050912" />
    </linearGradient>
    <linearGradient id="sunsetVeil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060D1C" stop-opacity="0.44" />
      <stop offset="22%" stop-color="#081226" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#040812" stop-opacity="0.42" />
    </linearGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050912" stop-opacity="0.0" />
    </radialGradient>
    <linearGradient id="titaniumRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B87A" />
      <stop offset="48%" stop-color="#475569" />
      <stop offset="100%" stop-color="#D99552" />
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="211" y="952" width="783" height="1581" rx="72" ry="72" />
    </clipPath>
    <filter id="deviceShadow" x="-16%" y="-10%" width="132%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="26" flood-color="#FF9E3D" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.68" />
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000000" flood-opacity="0.72" />
    </filter>
  </defs>

  <!-- 1. Base Layer & Real Crimean Coastal Sunset Photography -->
  <g id="layer-ai-background">
    <g id="layer-photo-background">
      <rect id="layer-background" width="1206" height="2622" fill="url(#bgGrad)" />
      <image id="layer-crimea-sunset" href="/Users/love/Documents/Documents - MacBook Air - Віта/GitHub/Keyboard/marketing/templates/assets/crimea_twilight_iphone_bg.png" xlink:href="/Users/love/Documents/Documents - MacBook Air - Віта/GitHub/Keyboard/marketing/templates/assets/crimea_twilight_iphone_bg.png" x="0" y="0" width="1206" height="2622" preserveAspectRatio="none" />
      <rect id="layer-veil" width="1206" height="2622" fill="url(#sunsetVeil)" />
      <rect id="layer-horizon-glow" width="1206" height="2622" fill="url(#horizonGlow)" />
    </g>
  </g>

  <!-- 2. Clean Canva DAHZG5VPIOs 2-Element Header (Bold 2-Line Headline + Bulleted 2-Line Subtitle) -->
  <g id="layer-header-copy" filter="url(#textShadow)">
    <g id="layer-copy">
      <rect id="layer-badge-pill" x="133" y="131" width="940" height="498" rx="40" ry="40" fill="#060A12" fill-opacity="0.40" />
      <text x="603" y="256" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="71" font-weight="800" letter-spacing="-0.6" fill="#FFFFFF">        <tspan x="603" y="256">Your Data</tspan>
        <tspan x="603" y="334">Stays Safe</tspan></text>
      <text x="603" y="450" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="29" font-weight="500" fill="#E2E8F0">        <tspan x="603" y="450">Works completely offline •</tspan>
        <tspan x="603" y="489">No typed text is ever sent online</tspan></text>
    </g>
  </g>

  <!-- 3. Feature Keywords Layer (Folded into Subtitle for Clean Canva Look; Kept Hidden for Layer Schema Compatibility) -->
  <g id="layer-feature-pills" opacity="0">
    <g id="pill-1">
      <rect x="286" y="447" width="193" height="39" rx="19" ry="19" fill="#FFFFFF" fill-opacity="0.12" stroke="#FDE047" stroke-opacity="0.62" stroke-width="1.4" />
      <text x="382" y="473" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">100% Offline</text>
    </g>
    <g id="pill-2">
      <rect x="495" y="447" width="216" height="39" rx="19" ry="19" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.4" />
      <text x="603" y="473" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">Zero Telemetry</text>
    </g>
    <g id="pill-3">
      <rect x="727" y="447" width="193" height="39" rx="19" ry="19" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.4" />
      <text x="823" y="473" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">Full Privacy</text>
    </g>
  </g>

  <!-- 4. Realistic iPhone Hardware Chassis & Crisp 1:1 Screen Layer -->
  <g id="layer-device-frame" filter="url(#deviceShadow)">
    <!-- Side Hardware Buttons (Action, Volume Up, Volume Down, Power) -->
    <rect x="186" y="1158" width="6" height="42" rx="4" fill="#78716C" />
    <rect x="186" y="1239" width="6" height="74" rx="4" fill="#78716C" />
    <rect x="186" y="1336" width="6" height="74" rx="4" fill="#78716C" />
    <rect x="1013" y="1271" width="6" height="110" rx="4" fill="#78716C" />

    <!-- Outer Warm-Lit Titanium Rim & Inner Black Bezel -->
    <rect x="190" y="931" width="825" height="1623" rx="90" ry="90" fill="url(#titaniumRim)" />
    <rect x="196" y="937" width="813" height="1611" rx="84" ry="84" fill="#07090E" />

    <!-- Real Lossless Build Screenshot -->
    <image id="layer-screenshot" href="/Users/love/Documents/Documents - MacBook Air - Віта/GitHub/Keyboard/docs/release/2026-10-25/assets/store_iphone_05_home_dark_en.png" xlink:href="/Users/love/Documents/Documents - MacBook Air - Віта/GitHub/Keyboard/docs/release/2026-10-25/assets/store_iphone_05_home_dark_en.png" x="211" y="952" width="783" height="1581" clip-path="url(#screenClip)" preserveAspectRatio="xMidYMid slice" />

    <!-- Dynamic Island Hardware Pill -->
    <rect x="500" y="970" width="207" height="57" rx="28" ry="28" fill="#050608" />
    <circle cx="678" cy="998" r="12" fill="#111827" stroke="#1E293B" stroke-width="2" />
  </g>
</svg>
