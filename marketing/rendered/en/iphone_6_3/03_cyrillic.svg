<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1206 2622" width="1206" height="2622">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16243A" />
      <stop offset="100%" stop-color="#0C1524" />
    </linearGradient>
    <linearGradient id="sunsetVeil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07101E" stop-opacity="0.72" />
      <stop offset="28%" stop-color="#0B1628" stop-opacity="0.46" />
      <stop offset="100%" stop-color="#050912" stop-opacity="0.86" />
    </linearGradient>
    <linearGradient id="titaniumRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="133" y="485" width="940" height="1992" rx="72" ry="72" />
    </clipPath>
    <filter id="deviceShadow" x="-12%" y="-8%" width="124%" height="122%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.62" />
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Layer & Crimean Coast Sunset Photography -->
  <rect id="layer-background" width="1206" height="2622" fill="url(#bgGrad)" />
  <image id="layer-crimea-sunset" href="/Users/love/Documents/Documents - MacBook Air - Віта/GitHub/Keyboard/marketing/templates/assets/crimea_sunset_bg.png" x="0" y="0" width="1206" height="2622" preserveAspectRatio="xMidYMid slice" />
  <rect id="layer-veil" width="1206" height="2622" fill="url(#sunsetVeil)" />

  <!-- Clean Apple-Grade Headline & Subheadline Copy Layer -->
  <g id="layer-copy" filter="url(#textShadow)">
    <text x="603" y="152" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="25" font-weight="700" letter-spacing="2.4" fill="#FBBF24">TWO SCRIPTS IN ONE</text>
    <text x="603" y="277" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="51" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">Cyrillic &amp; Live Transliteration</text>
    <text x="603" y="377" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="30" font-weight="500" fill="#E2E8F0">селям → selâm • Ukrainian FIVA and classic Cyrillic layouts</text>
  </g>

  <!-- Realistic iPhone Hardware Chassis & Screen Layer -->
  <g id="layer-device-frame" filter="url(#deviceShadow)">
    <!-- Side Hardware Buttons (Action, Volume Up, Volume Down, Power) -->
    <rect x="108" y="748" width="6" height="52" rx="4" fill="#64748B" />
    <rect x="108" y="850" width="6" height="93" rx="4" fill="#64748B" />
    <rect x="108" y="972" width="6" height="93" rx="4" fill="#64748B" />
    <rect x="1092" y="891" width="6" height="138" rx="4" fill="#64748B" />

    <!-- Outer Titanium Rim & Inner Black Bezel -->
    <rect x="112" y="464" width="982" height="2034" rx="90" ry="90" fill="url(#titaniumRim)" />
    <rect x="118" y="470" width="970" height="2022" rx="84" ry="84" fill="#07090E" />

    <!-- Real Build Screenshot -->
    <image href="/Users/love/Documents/Documents - MacBook Air - Віта/GitHub/Keyboard/docs/release/2026-10-25/assets/store_iphone_03_cyrillic_en.png" x="133" y="485" width="940" height="1992" clip-path="url(#screenClip)" preserveAspectRatio="xMidYMid slice" />

    <!-- Dynamic Island Hardware Pill -->
    <rect x="479" y="507" width="249" height="69" rx="34" ry="34" fill="#050608" />
    <circle cx="693" cy="541" r="15" fill="#111827" stroke="#1E293B" stroke-width="2" />
  </g>
</svg>
