<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{WIDTH}} {{HEIGHT}}" width="{{WIDTH}}" height="{{HEIGHT}}">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{BG_START}}" />
      <stop offset="100%" stop-color="{{BG_END}}" />
    </linearGradient>
    <linearGradient id="sunsetVeil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07101E" stop-opacity="0.72" />
      <stop offset="28%" stop-color="#0B1628" stop-opacity="0.46" />
      <stop offset="100%" stop-color="#050912" stop-opacity="0.86" />
    </linearGradient>
    <linearGradient id="titaniumRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="{{SCREEN_X}}" y="{{SCREEN_Y}}" width="{{SCREEN_W}}" height="{{SCREEN_H}}" rx="{{CORNER_RADIUS}}" ry="{{CORNER_RADIUS}}" />
    </clipPath>
    <filter id="deviceShadow" x="-12%" y="-8%" width="124%" height="122%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.62" />
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Layer & Crimean Coast Sunset Photography -->
  <rect id="layer-background" width="{{WIDTH}}" height="{{HEIGHT}}" fill="url(#bgGrad)" />
  <image id="layer-crimea-sunset" href="{{CRIMEA_BG_URI}}" x="0" y="0" width="{{WIDTH}}" height="{{HEIGHT}}" preserveAspectRatio="xMidYMid slice" />
  <rect id="layer-veil" width="{{WIDTH}}" height="{{HEIGHT}}" fill="url(#sunsetVeil)" />

  <!-- Clean Apple-Grade Headline & Subheadline Copy Layer -->
  <g id="layer-copy" filter="url(#textShadow)">
    <text x="{{CENTER_X}}" y="{{BADGE_TEXT_Y}}" text-anchor="middle" font-family="{{HEADLINE_FONT}}" font-size="{{BADGE_SIZE}}" font-weight="700" letter-spacing="2.4" fill="{{ACCENT}}">{{BADGE_TEXT}}</text>
    <text x="{{CENTER_X}}" y="{{TITLE_Y}}" text-anchor="middle" font-family="{{HEADLINE_FONT}}" font-size="{{TITLE_SIZE}}" font-weight="800" letter-spacing="-0.5" fill="{{HEADLINE_COLOR}}">{{TITLE}}</text>
    <text x="{{CENTER_X}}" y="{{SUBTITLE_Y}}" text-anchor="middle" font-family="{{BODY_FONT}}" font-size="{{SUBTITLE_SIZE}}" font-weight="500" fill="{{SUBTITLE_COLOR}}">{{SUBTITLE}}</text>
  </g>

  <!-- Realistic iPhone Hardware Chassis & Screen Layer -->
  <g id="layer-device-frame" filter="url(#deviceShadow)">
    <!-- Side Hardware Buttons (Action, Volume Up, Volume Down, Power) -->
    <rect x="{{BTN_LEFT_X}}" y="{{BTN_ACTION_Y}}" width="{{BTN_W}}" height="{{BTN_ACTION_H}}" rx="4" fill="#64748B" />
    <rect x="{{BTN_LEFT_X}}" y="{{BTN_VOL1_Y}}" width="{{BTN_W}}" height="{{BTN_VOL_H}}" rx="4" fill="#64748B" />
    <rect x="{{BTN_LEFT_X}}" y="{{BTN_VOL2_Y}}" width="{{BTN_W}}" height="{{BTN_VOL_H}}" rx="4" fill="#64748B" />
    <rect x="{{BTN_RIGHT_X}}" y="{{BTN_PWR_Y}}" width="{{BTN_W}}" height="{{BTN_PWR_H}}" rx="4" fill="#64748B" />

    <!-- Outer Titanium Rim & Inner Black Bezel -->
    <rect x="{{OUTER_X}}" y="{{OUTER_Y}}" width="{{OUTER_W}}" height="{{OUTER_H}}" rx="{{OUTER_RADIUS}}" ry="{{OUTER_RADIUS}}" fill="url(#titaniumRim)" />
    <rect x="{{FRAME_X}}" y="{{FRAME_Y}}" width="{{FRAME_W}}" height="{{FRAME_H}}" rx="{{FRAME_RADIUS}}" ry="{{FRAME_RADIUS}}" fill="#07090E" />

    <!-- Real Build Screenshot -->
    <image href="{{SCREENSHOT_URI}}" x="{{SCREEN_X}}" y="{{SCREEN_Y}}" width="{{SCREEN_W}}" height="{{SCREEN_H}}" clip-path="url(#screenClip)" preserveAspectRatio="xMidYMid slice" />

    <!-- Dynamic Island Hardware Pill -->
    <rect x="{{ISLAND_X}}" y="{{ISLAND_Y}}" width="{{ISLAND_W}}" height="{{ISLAND_H}}" rx="{{ISLAND_RX}}" ry="{{ISLAND_RX}}" fill="#050608" />
    <circle cx="{{CAMERA_CX}}" cy="{{CAMERA_CY}}" r="{{CAMERA_R}}" fill="#111827" stroke="#1E293B" stroke-width="2" />
  </g>
</svg>
